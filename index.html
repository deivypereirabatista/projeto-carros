<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>UniCarros</title>
</head>

<body>
    
    <button class="btn btn-secondary position-absolute top-0 end-0 m-3" id="alterarTemaSite" onclick="alterarTemaSite()"><i class="bi bi-sun"></i></button>
    <h1 class="text-center mb-4 p-3">UniCarros <br></h1>
    <div class="container text-center">
        <div class="row" id="cards">

        </div>
    </div>


    <dialog class="dialog" id="zoomImg" aria-labelledby="nomeCarro" aria-hidden="true">
        <div class="dialog-header">
            <h1 class="dialog-title" id="nomeCarro">Dialog title</h1>
        </div>
        <div class="dialog-body">
            <img src="" id="imgModal" class="card-img-top" alt="Imagem do Carro">
            <p id="descricaoCarro"></p>
        </div>
        <div class="dialog-footer">
            <button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog">Close</button>
        </div>
    </dialog>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>

    <script src="/javascript.js"></script>
</body>

</html>
